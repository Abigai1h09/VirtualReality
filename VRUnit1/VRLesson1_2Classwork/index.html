<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#E8DAF0"></a-box>
      <a-box position="-1 1.5 -3" rotation="0 90 0" color="#E8DAF0"></a-box>

      <a-sphere position="0 1.25 -5" radius="1.25" color="#FFD1DC"></a-sphere>
      <a-sphere position="4.5 1.25 -5" radius="1.25" color="#FFF9A6"></a-sphere>
      <a-sphere position="-4.5 1.25 -5" radius="1.25" color="#E8D7FF"></a-sphere>

      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#BFFCC6"></a-cylinder>
      <a-cylinder position="1 0.75 -2" radius="0.5" height="1" width="2" color="#97C1A9"></a-cylinder>
      <a-cylinder position="1 0.75 -1" radius="0.5" height=".5" color="#8FCACA"></a-cylinder>
     
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#FF968A"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
