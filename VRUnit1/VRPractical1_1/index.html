<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>

      <a-sphere position="-0.9 -0.5 -1.2" radius="0.4" color="#000000"></a-sphere>

      <a-plane position="0.67 0.95 -0.7" rotation="0 90 0" width="-0.76" color="#FFB6C1" material="side: double" width="0.6" height="0.5" ></a-plane>

      <a-box position="0.6 0.2 1.3" width="0.1" height="0.2" color="#FFB6C1"></a-box>
      <a-box position="-0.6 0.2 1.3" width="0.1" height="0.2" color="#FFB6C1"></a-box>

      </a-box> 

      <a-plane position="0 -0.9 0.40" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>

</html>
